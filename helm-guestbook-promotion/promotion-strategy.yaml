apiVersion: promoter.argoproj.io/v1alpha1
kind: PromotionStrategy
metadata:
  name: demo-github
  namespace: helm-guestbook-promotion
spec:
  activeCommitStatuses:
    # The ArgoCDCommitStatus CR will maintain this commit status based on the application health.
    - key: argocd-health
  environments:
    - autoMerge: true
      branch: environment/development
    - autoMerge: true
      branch: environment/staging
      dependsOn:
        - environment/development
      activeCommitStatuses:
        - key: dependents-successful
    - autoMerge: false
      branch: environment/prod
      dependsOn:
        - environment/staging
      # The TimedCommitStatus CR gates this environment for a fixed soak period before reporting success.
      activeCommitStatuses:
        - key: timer
        - key: dependents-successful
  gitRepositoryRef:
    name: github-argocd-example-apps
---
apiVersion: promoter.argoproj.io/v1alpha1
kind: PromotionStrategy
metadata:
  name: demo-github-2
  namespace: helm-guestbook-promotion
spec:
  activeCommitStatuses:
    - key: argocd-health
  environments:
    - autoMerge: false
      branch: environment/alpha
    - autoMerge: false
      branch: environment/beta
    - autoMerge: false
      branch: environment/gamma
  gitRepositoryRef:
    name: github-argocd-example-apps
