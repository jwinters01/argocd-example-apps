apiVersion: promoter.argoproj.io/v1alpha1
kind: ArgoCDCommitStatus
metadata:
  name: argocd-health
  namespace: helm-guestbook-promotion
spec:
  promotionStrategyRef:
    name: demo-github
  applicationSelector:
    matchLabels:
      app-name: helm-guestbook
---
apiVersion: promoter.argoproj.io/v1alpha1
kind: TimedCommitStatus
metadata:
  name: prod-soak-timer
  namespace: helm-guestbook-promotion
spec:
  promotionStrategyRef:
    name: demo-github
  key: timer
  environments:
    - branch: environment/prod
      duration: 2m
---
apiVersion: promoter.argoproj.io/v1alpha1
kind: DependentsSuccessfulCommitStatus
metadata:
  name: demo-github-dependents
  namespace: helm-guestbook-promotion
spec:
  promotionStrategyRef:
    name: demo-github
  key: dependents-successful
---
apiVersion: promoter.argoproj.io/v1alpha1
kind: DependentsSuccessfulCommitStatus
metadata:
  name: demo-github-2-dependents
  namespace: helm-guestbook-promotion
spec:
  promotionStrategyRef:
    name: demo-github-2
  key: dependents-successful
